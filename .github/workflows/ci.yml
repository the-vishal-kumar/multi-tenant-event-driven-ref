name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow only reads the repository. No job needs a
# token with write scopes, cloud credentials, or secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Terraform fmt/validate/tflint/checkov and actionlint, all via Docker
  # images so local runs and CI use the same tool versions.
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/lint.sh

  # API typecheck, unit and integration tests; Go vet and race tests (unit, and
  # against Postgres and LocalStack); end-to-end through docker compose.
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/test.sh
      - name: Service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Tear down
        if: always()
        run: docker compose down -v

  # npm audit, govulncheck and a trivy scan of the built images.
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/audit.sh
